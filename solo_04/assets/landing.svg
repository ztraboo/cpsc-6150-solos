<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="g" x1="0" x2="1">
      <stop offset="0" stop-color="#4facfe" />
      <stop offset="1" stop-color="#00f2fe" />
    </linearGradient>
  </defs>
  <!-- Use absolute numeric sizes instead of percentage strings to avoid
    runtime parsing issues when SVG attributes are interpreted. -->
  <rect x="0" y="0" width="800" height="400" fill="url(#g)" />
  <g fill="white" opacity="0.12">
    <circle cx="100" cy="100" r="80" />
    <circle cx="700" cy="300" r="120" />
  </g>
  <text x="50%" y="50%" font-family="Arial, Helvetica, sans-serif" font-size="36" fill="white" text-anchor="middle" dy=".3em">Event Landing Image</text>
</svg>